apply plugin: 'com.android.application'

// Minimal Fitness watch face: a Watch Face Format (declarative XML) bundle with no code.
// Requires Wear OS 4 or newer (Pixel Watch 2, Pixel Watch 3, or Pixel Watch 1 updated to Wear OS 4).
android {
    // One stable key for every build (the key your installed apps already use), so updates install over the top
    // and keep your data. Keep a copy of ../signing/ky-fitness-signing.keystore somewhere safe.
    signingConfigs {
        ky {
            storeFile rootProject.file('../signing/ky-fitness-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    namespace = "com.kyfitness.face"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.kyfitness.face"
        minSdkVersion 33
        targetSdkVersion 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        // Minifying strips the empty R class so the bundle contains no code (as the official samples do).
        debug {
            signingConfig signingConfigs.ky
            minifyEnabled true
        }
        release {
            signingConfig signingConfigs.ky
            minifyEnabled true
        }
    }
}

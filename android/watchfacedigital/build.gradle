apply plugin: 'com.android.application'

// Minimal Fitness digital watch face: a Watch Face Format (declarative XML) bundle with no code.
// Requires Wear OS 4 or newer (Pixel Watch 2, Pixel Watch 3, or Pixel Watch 1 updated to Wear OS 4).
// The project's own development key is kept out of the repository. Without it (a fresh clone, or GitHub's build machines) Android's standard debug key is used.
def kyDebugKeyExists = rootProject.file("../signing/ky-fitness-signing.keystore").exists()

android {
    // One stable key for every build (the key your installed apps already use), so updates install over the top
    // and keep your data. Keep a copy of ../signing/ky-fitness-signing.keystore somewhere safe.
    signingConfigs {
        ky {
            storeFile rootProject.file('../signing/ky-fitness-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    namespace = "com.kyfitness.face.digital"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.kyfitness.face.digital"
        minSdkVersion 33
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        // Minifying strips the empty R class so the bundle contains no code (as the official samples do).
        debug {
            signingConfig kyDebugKeyExists ? signingConfigs.ky : signingConfigs.debug
            minifyEnabled true
        }
        release {
            signingConfig kyDebugKeyExists ? signingConfigs.ky : signingConfigs.debug
            minifyEnabled true
        }
    }
}

// Release signing for the Play Store, shared by the phone app and the watch app.
//
// Debug builds keep using the old development key (../signing/ky-fitness-signing.keystore) so installed copies update in place.
// Release builds are signed ONLY with your private upload key, which is read from keystore.properties in the project root.
// That file and the key it points to are git-ignored and must never be committed or shared. See keystore.properties.example.
// With no keystore.properties, a release build stops with an explanation instead of signing with the development key.

def uploadProps = new Properties()
def uploadFile = rootProject.file('../keystore.properties')
if (uploadFile.exists()) {
    uploadFile.withInputStream { uploadProps.load(it) }
}

ext.hasUploadKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { uploadProps.getProperty(it) }

ext.configureUploadKey = { signingConfigs ->
    if (ext.hasUploadKey) {
        signingConfigs.create('upload') {
            storeFile new File(uploadProps.getProperty('storeFile'))
            storePassword uploadProps.getProperty('storePassword')
            keyAlias uploadProps.getProperty('keyAlias')
            keyPassword uploadProps.getProperty('keyPassword')
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { it.project == project && it.name ==~ /^(assemble|bundle|package|sign)Release.*/ }
    if (releaseTask && !ext.hasUploadKey) {
        throw new GradleException(
            'Release builds need your upload key. Create keystore.properties in the project root (copy keystore.properties.example) ' +
            'with the path and passwords of your upload keystore. The development key is never used for releases.')
    }
}

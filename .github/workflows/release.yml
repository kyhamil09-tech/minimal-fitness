name: Release

# Builds the phone and watch APKs from the public source, on GitHub's own machines, and attaches them to a release together
# with their SHA-256 checksums and a signed build-provenance attestation. Nothing here is built on anyone's personal computer.
# To make a release: push a tag such as v1.0.0.  See VERIFY.md for how to check a download.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the release
  id-token: write       # sign the provenance attestation
  attestations: write   # store the attestation

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the full history gives each release a rising version number

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build the web app and sync it into Android
        run: |
          npm run build
          npx cap sync android

      - name: Prepare the release key (kept in GitHub secrets, never in the repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(( $(git rev-list --count HEAD) ))
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease \
            -PkyVersionName="$VERSION" -PkyVersionCode="$CODE"

      - name: Collect the files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/minimal-fitness.apk
          cp android/wear/build/outputs/apk/release/wear-release.apk out/minimal-fitness-wear.apk
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          rm -f "$RUNNER_TEMP/release.keystore" ../keystore.properties

      - name: Attest where the files came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/minimal-fitness.apk
            out/minimal-fitness-wear.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Minimal Fitness $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

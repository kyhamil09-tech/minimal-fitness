name: Checks

# Every push and pull request is type-checked, tested and built, in public, so a change that breaks things is visible.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build the debug APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :wear:assembleDebug
